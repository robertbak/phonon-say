name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep the build reproducible and quiet about unused features.
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            cmake \
            nasm \
            perl \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Test
        run: cargo test --release

      - name: Verify third-party licenses are current
        if: runner.os == 'Linux'
        run: |
          python3 scripts/third-party-licenses.py
          git diff --exit-code -- THIRD_PARTY_LICENSES.md

  arm64:
    name: build (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            cmake \
            nasm \
            perl \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the runner really is aarch64
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "host=$host"
          if [ "$host" != "aarch64-unknown-linux-gnu" ]; then
            echo "::error::expected an aarch64 runner, got $host"
            exit 1
          fi

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            cmake \
            nasm \
            perl \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Package (cargo package)
        run: cargo package --locked

      - name: Verify the packaged crate builds
        run: |
          tarball=$(ls target/package/*.crate)
          mkdir -p /tmp/pkg
          tar -xzf "$tarball" -C /tmp/pkg
          cd /tmp/pkg/phonon-say-*
          cargo build --release --locked
