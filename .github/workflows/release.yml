name: Release

# Cut a release by pushing a tag. The tag must be `v<version>` and must match
# the version in Cargo.toml, so there is exactly one place to bump.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            cmake \
            nasm \
            perl \
            pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; fi
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "tag=$tag version=$version"
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match Cargo.toml version $version"
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build release binary
        run: |
          host=$(rustc -vV | sed -n 's/^host: //p')
          echo "host=$host expected=${{ matrix.target }}"
          if [ "$host" != "${{ matrix.target }}" ]; then
            echo "::error::runner is $host, expected ${{ matrix.target }}"
            exit 1
          fi
          cargo build --release --locked
          mkdir -p dist
          cp target/release/phonon-say dist/phonon-say
          strip dist/phonon-say || true
          # Fail loudly here rather than publishing a broken asset.
          test -x dist/phonon-say
          file dist/phonon-say

      - name: Package tarball
        run: |
          name="phonon-say-$VERSION-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp dist/phonon-say "dist/$name/phonon-say"
          cp README.md NOTICE LICENSE-MIT LICENSE-APACHE THIRD_PARTY_LICENSES.md \
            "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          test -s "dist/$name.tar.gz"

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: phonon-say-${{ matrix.arch }}
          path: dist/phonon-say-${{ env.VERSION }}-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download the tarballs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum phonon-say-*-linux-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Write release notes from the CHANGELOG
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          tag="${GITHUB_REF_NAME}"
          if [ -n "${{ inputs.tag }}" ]; then tag="${{ inputs.tag }}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          {
            echo "## phonon-say $version"
            echo
            if [ -f CHANGELOG.md ]; then
              # The section for this version, up to the next heading, without the
              # trailing link-reference definitions.
              awk -v v="$version" '
                $0 ~ "^## \\[" v "\\]" { found=1; next }
                found && /^## \[/ { exit }
                found && /^\[.*\]: / { exit }
                found { print }
              ' CHANGELOG.md
            fi
            echo
            echo "**Full Changelog**: https://github.com/robertbak/phonon-say/compare/$tag...HEAD"
          } > dist/RELEASE_NOTES.md
          cat dist/RELEASE_NOTES.md

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: phonon-say ${{ env.VERSION }}
          tag_name: ${{ env.TAG }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/phonon-say-*-linux-*.tar.gz
            dist/SHA256SUMS
